name: frontend

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/frontend.yml"
      - "html/**"
  pull_request:
    paths:
      - ".github/workflows/frontend.yml"
      - "html/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
          yarn install
        working-directory: html

      - name: Auto-fix prettier & eslint
        run: |
          npx prettier --write src/components/buttonbar/index.tsx \
                               src/components/buttonbar/buttonbar.scss \
                               src/components/terminal/index.tsx \
                               src/style/index.scss
          npx eslint --fix src/components/buttonbar/index.tsx \
                           src/components/terminal/index.tsx || true
        working-directory: html

      - name: Build frontend & generate src/html.h
        run: yarn run build
        working-directory: html

      - name: Check if html.h changed
        id: diff
        run: |
          git diff --quiet src/html.h && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & push src/html.h
        if: github.event_name != 'pull_request' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/html.h
          git commit -m "chore: rebuild src/html.h [skip ci]"
          git push
