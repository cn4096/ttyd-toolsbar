name: release

on:
  push:
    tags: ["*"]
  release:
    types: [published]  # 网页发布 Release 时也触发

jobs:
  build:
    uses: ./.github/workflows/backend.yml
  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check version bump
        run: |
          TAG=$(git describe --tags --match "[0-9]*" --abbrev=8 2>/dev/null || echo "${{ github.ref_name }}")
          echo "Building tag: $TAG"
      - uses: actions/download-artifact@v4
      - run: |
          mkdir build
          for file in ttyd.*/*; do
            target=$(echo $file | awk -F/ '{print $1}')
            [[ $file == *.exe ]] && target="$target.exe"
            mv $file build/$target
          done
          pushd build; sha256sum ttyd.* > SHA256SUMS; popd
      - uses: ncipollo/release-action@v1
        with:
          artifacts: build/*
          allowUpdates: true
          draft: false
